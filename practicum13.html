
<!DOCTYPE html>
<html>
<head>
    <title>Bookhive - Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8e2f2, #e3edf5);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(50, 50, 80, 0.15);
        }

        header {
            text-align: center;
            background: #263c50;
            color: white;
            padding: 15px;
            border-radius: 10px;
        }

        h1 {
            margin: 10px;
        }

        .subtitle {
            color: #dce7ef;
        }

        h3 {
            color: #263c50;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 12px;
            border: 2px solid #c5d4e2;
            border-radius: 7px;
            font-size: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #263c50;
            color: white;
        }

        .add-btn:hover {
            background: #405d75;
        }

        .search-box {
            width: 100%;
            margin-top: 15px;
        }

        .task-info {
            display: flex;
            justify-content: space-between;
            background: #edf1f7;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        ul {
            padding: 0;
            margin-top: 25px;
        }

        li {
            list-style: none;
            background: #edf1f7;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .task-name {
            color: #263c50;
            flex: 1;
            overflow-wrap: anywhere;
        }

        .category {
            color: #647d91;
            font-size: 12px;
            width: 100%;
        }

        .edit-btn {
            background: #8da9c4;
            color: white;
        }

        .delete-btn {
            background: #d98e9b;
            color: white;
        }

        .complete-btn {
            background: #789b78;
            color: white;
        }

        .clear-btn {
            background: #d98e9b;
            color: white;
            margin-top: 15px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .empty {
            text-align: center;
            color: #888;
        }

        footer {
            text-align: center;
            color: #647d91;
            margin-top: 25px;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
                margin: 20px auto;
            }

            .input-section {
                flex-direction: column;
            }

            .input-section button {
                width: 100%;
            }

            .task-info {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>📚 Bookhive</h1>
        <p class="subtitle">
            Digital Library and Book Subscription Services
        </p>
    </header>

    <h3>Add Your Library Task</h3>

    <div class="input-section">

        <input type="text"
               id="taskInput"
               placeholder="Enter your library task">

        <select id="category">
            <option value="Reading">Reading</option>
            <option value="Subscription">Subscription</option>
            <option value="Book Return">Book Return</option>
            <option value="E-Books">E-Books</option>
        </select>

        <button class="add-btn" onclick="addTask()">
            Add Task
        </button>

    </div>

    <input type="text"
           id="searchInput"
           class="search-box"
           placeholder="Search your tasks..."
           onkeyup="searchTasks()">

    <div class="task-info">

        <span>Total Tasks: <b id="total">0</b></span>

        <span>Completed: <b id="completedCount">0</b></span>

        <span>Pending: <b id="pendingCount">0</b></span>

    </div>

    <h3>My Library Tasks</h3>

    <ul id="taskList"></ul>

    <button class="clear-btn" onclick="clearTasks()">
        Clear All Tasks
    </button>

    <footer>
        <p>© 2026 Bookhive Digital Library</p>
        <p>Read More, Learn More!</p>
    </footer>

</div>

<script>

    // Array to store library tasks
    let tasks = [];

    // CREATE - Add a new task
    function addTask() {

        let input = document.getElementById("taskInput");

        let category = document.getElementById("category");

        let taskName = input.value.trim();

        if (taskName === "") {

            alert("Please enter a library task!");

            return;
        }

        // Add task to array
        tasks.push({

            name: taskName,

            category: category.value,

            completed: false

        });

        input.value = "";

        displayTasks();
    }

    // READ - Display all tasks
    function displayTasks() {

        let list = document.getElementById("taskList");

        list.innerHTML = "";

        if (tasks.length === 0) {

            list.innerHTML =
                '<p class="empty">No library tasks added yet!</p>';

        }

        tasks.forEach(function(task, index) {

            let li = document.createElement("li");

            let span = document.createElement("span");

            span.className = "task-name";

            span.textContent = task.name;

            if (task.completed) {

                span.classList.add("completed");

            }

            let categoryText = document.createElement("small");

            categoryText.className = "category";

            categoryText.textContent =
                "Category: " + task.category;

            // UPDATE - Edit button
            let editBtn = document.createElement("button");

            editBtn.textContent = "Edit";

            editBtn.className = "edit-btn";

            editBtn.onclick = function() {

                updateTask(index);

            };

            // COMPLETE button
            let completeBtn = document.createElement("button");

            completeBtn.textContent =
                task.completed ? "Undo" : "Done";

            completeBtn.className = "complete-btn";

            completeBtn.onclick = function() {

                tasks[index].completed =
                    !tasks[index].completed;

                displayTasks();

            };

            // DELETE button
            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";

            deleteBtn.className = "delete-btn";

            deleteBtn.onclick = function() {

                deleteTask(index);

            };

            li.appendChild(span);

            li.appendChild(editBtn);

            li.appendChild(completeBtn);

            li.appendChild(deleteBtn);

            li.appendChild(categoryText);

            list.appendChild(li);

        });

        updateCounter();

    }

    // UPDATE - Edit an existing task
    function updateTask(index) {

        let newTask = prompt(
            "Enter the updated library task:",
            tasks[index].name
        );

        if (newTask !== null && newTask.trim() !== "") {

            tasks[index].name = newTask.trim();

            displayTasks();

        }
    }

    // DELETE - Remove a task
    function deleteTask(index) {

        if (confirm("Are you sure you want to delete this task?")) {

            tasks.splice(index, 1);

            displayTasks();

        }
    }

    // UPDATE TASK COUNTERS
    function updateCounter() {

        let total = tasks.length;

        let completed = tasks.filter(function(task) {

            return task.completed;

        }).length;

        let pending = total - completed;

        document.getElementById("total").textContent = total;

        document.getElementById("completedCount").textContent =
            completed;

        document.getElementById("pendingCount").textContent =
            pending;

    }

    // SEARCH - Find a library task
    function searchTasks() {

        let searchValue = document.getElementById("searchInput")
            .value.toLowerCase();

        let list = document.getElementById("taskList");

        let items = list.getElementsByTagName("li");

        for (let i = 0; i < items.length; i++) {

            let text = items[i].textContent.toLowerCase();

            if (text.includes(searchValue)) {

                items[i].style.display = "flex";

            } else {

                items[i].style.display = "none";

            }

        }

    }

    // DELETE ALL TASKS
    function clearTasks() {

        if (tasks.length === 0) {

            alert("No tasks to clear!");

            return;
        }

        if (confirm("Do you want to clear all library tasks?")) {

            tasks = [];

            displayTasks();

        }

    }

</script>

</body>
</html>
